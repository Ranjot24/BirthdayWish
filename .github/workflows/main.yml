name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ETERNELLE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish permanent download (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ETERNELLE.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ETERNELLE.apk \
            --title "ETERNELLE — latest build" \
            --notes "Install ETERNELLE.apk on Android 7+. Built from commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
